<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iframe Form</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 1rem; }
  label { display: block; margin: 0.3rem 0 0.2rem; font-size: 0.9rem; }
  input, textarea { display: block; width: 100%; padding: 0.3rem; border: 1px solid #aaa; border-radius: 3px; box-sizing: border-box; font-size: 0.85rem; }
  .field-group { margin-bottom: 0.5rem; }
</style>
</head>
<body>
<h3 style="font-size:1rem;margin-top:0">Iframe Form</h3>
<form>
  <div class="field-group">
    <label for="iframe-name">Name in iframe</label>
    <input id="iframe-name" name="iframe_name" type="text" placeholder="Your name">
  </div>
  <div class="field-group">
    <label for="iframe-why">Why this company?</label>
    <textarea id="iframe-why" name="iframe_why" rows="2" placeholder="Tell us why..."></textarea>
  </div>
  <div class="field-group">
    <label for="iframe-years">Years of experience</label>
    <select id="iframe-years" name="iframe_years">
      <option>&lt; 1</option>
      <option>1-3</option>
      <option>3-5</option>
      <option>5+</option>
    </select>
  </div>
</form>
</body>
</html>
